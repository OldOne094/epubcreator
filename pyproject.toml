[project]
name = "epubcreator"
version = "0.1.0"
description = "EPUB builder desktop app with professional Arabic support"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1",
    "lxml==6.1.1",
    "python-docx==1.2.0",
    "striprtf==0.0.32",
    "markdown-it-py==4.2.0",
    "Pillow==12.3.0",
    "platformdirs==4.11.0",
    "arabic_reshaper==3.0.1",
    "python-bidi==0.6.11",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
